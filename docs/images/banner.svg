<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="567" viewBox="0 0 1280 567" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Network Growth Assistant</title>
<desc id="d">Grow your professional network and run your job search from one calm, honest workspace. Built with Next.js 16, React 19, TypeScript, Tailwind CSS 4, shadcn/ui, Base UI, Recharts, cmdk, Lucide; Supabase, PostgreSQL, Row-level security, pgvector, pg_cron, Edge Functions, Zod, Nodemailer; React-PDF, docx, mammoth, unpdf; Gemini, Groq, Mistral, Claude, GitHub API, ORCID, ROR, Employer job boards; Vitest, pgTAP, Playwright, axe-core, ESLint, Docker, GitHub Actions, Vercel, Node.js 24.</desc>
