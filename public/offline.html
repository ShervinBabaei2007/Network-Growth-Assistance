<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Network Growth</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
      main { max-width: 26rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1rem; color: GrayText; }
      a, button { font: inherit; padding: .6rem 1rem; border-radius: .5rem; border: 1px solid currentColor; background: transparent; color: inherit; text-decoration: none; cursor: pointer; display: inline-block; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page needs a connection. Today's queue and your saved jobs open offline if you looked at them recently on this device; everything else comes back when you're online again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/queue">Open the queue</a>
    </main>
  </body>
</html>
